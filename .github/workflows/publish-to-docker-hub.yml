name: Build and Publish Docker Image

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag
        id: vars
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG=${TAG#v}
          for script in bin/php-compat-check docker/bin/php-compat-check; do
            if [ "$(bash "$script" --version)" != "php-compat-check $TAG" ]; then
              echo "Version in $script does not match release tag $TAG" >&2
              exit 1
            fi
          done
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            zoliszabo/php-compat-check:${{ steps.vars.outputs.TAG }}
            zoliszabo/php-compat-check:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
